[package]
name = "zephyr-auth-gate"
version = "0.1.0"
edition = "2021"
description = "OutLayer WASM gate: verify NEAR signer and release a Zephyr deploy token from a TEE-protected secret"

[[bin]]
name = "zephyr-auth-gate"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1